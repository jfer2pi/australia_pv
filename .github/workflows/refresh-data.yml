name: Refresh data

# Monthly (and on demand): save Geoscience Australia's solar stations and, when
# AEMO allows it, the latest NEM Generation Information workbook next to app.R,
# then rewrite manifest.json and commit. The deployed app reads these files
# when the live sources refuse the hosting server.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "shiny", "bslib", "httr2", "jsonlite", "readxl", "dplyr", "tidyr", "leaflet", "plotly", "DT", "htmltools"))'

      - name: Refresh snapshots
        run: Rscript scripts/refresh_data.R

      - name: Catch up with main
        run: |
          rm -f refresh_changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin ${{ github.ref_name }}
          git stash pop || true

      - name: Write manifest.json
        run: |
          Rscript -e 'files <- c("app.R", list.files(pattern = "(generation.?information.*\\.xlsx|^au_geocode_cache\\.csv|^ga_solar_stations\\.csv|power.?stations?.*\\.csv)$", ignore.case = TRUE)); print(files); rsconnect::writeManifest(appFiles = files)'

      - name: Commit if changed
        run: |
          rm -f refresh_changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh data snapshots"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
